name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install CPU-only PyTorch and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy scipy pytest
      - name: NEXUS agent
        run: python -m pytest tests -q
      - name: CD-MCTS
        run: python -m pytest flagship_coalition_mcts/tests -q
      - name: CMAZ
        run: python -m pytest decomposed_mcts/tests -q
      - name: Equivariant network
        run: python -m pytest equivariant_net/tests -q
